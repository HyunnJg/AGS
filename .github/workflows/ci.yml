name: Verify AGS
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm start "CI smoke"
      - run: pnpm exec playwright install chromium --only-shell
      - run: pnpm run test:e2e
      - name: Stage and test Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP "AGS-Windows"
          New-Item -ItemType Directory "$package/scripts" -Force | Out-Null
          Copy-Item dist,examples -Destination $package -Recurse
          if (!(Test-Path "$package/examples/P2-workspace/notes/intro.md")) { throw "Missing P2 example" }
          Copy-Item Start-AGS.cmd,README.md -Destination $package
          Copy-Item scripts/open-windows.mjs -Destination "$package/scripts"
          '{"type":"module"}' | Set-Content "$package/package.json" -Encoding utf8
          New-Item -ItemType Directory "$package/licenses" -Force | Out-Null
          Copy-Item apps/web/node_modules/marked/LICENSE "$package/licenses/marked.txt"
          Copy-Item apps/web/node_modules/react/LICENSE "$package/licenses/react.txt"
          Copy-Item apps/web/node_modules/react-dom/LICENSE "$package/licenses/react-dom.txt"
          $scheduler = Get-ChildItem "node_modules/.pnpm/scheduler@*/node_modules/scheduler/LICENSE" | Select-Object -First 1
          Copy-Item $scheduler.FullName "$package/licenses/scheduler.txt"
          $env:AGS_PORT = "0"
          $env:AGS_STATE_DIR = Join-Path $env:RUNNER_TEMP "ags-package-test"
          & "$package/Start-AGS.cmd" --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location $env:RUNNER_TEMP
          $backup = "AGS test.ags-backup"
          & "$package/Start-AGS.cmd" export "$backup"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path $backup)) { throw "Missing backup in caller directory" }
          & "$package/Start-AGS.cmd" restore "$backup" "ags-restored"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:AGS_STATE_DIR = Join-Path $env:RUNNER_TEMP "ags-restored"
          if (!(Test-Path "$env:AGS_STATE_DIR/sessions.sqlite")) { throw "Missing restored database" }
          & "$package/Start-AGS.cmd" --check
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: AGS-Windows
          path: ${{ runner.temp }}/AGS-Windows/
          if-no-files-found: error
